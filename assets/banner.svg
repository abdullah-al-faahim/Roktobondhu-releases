<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="রক্তবন্ধু · Roktobondhu — find blood donors near you on a live map, Bangla first">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14201C"/>
      <stop offset="1" stop-color="#0E1513"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6B7D" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FF6B7D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="map"><rect width="1200" height="600" rx="32"/></clipPath>
  </defs>

  <g clip-path="url(#map)">
    <rect width="1200" height="600" fill="url(#bg)"/>
    <rect width="1200" height="600" fill="url(#glow)"/>

    <!-- River -->
    <path d="M1200 470 C1060 430 980 520 860 500 S 640 560 560 600 L1200 600 Z" fill="#0B2A3A"/>

    <!-- Roads: thin light lines, major roads brighter -->
    <g fill="none" stroke-linecap="round">
      <g stroke="#E8E2DA" stroke-opacity=".14" stroke-width="2">
        <path d="M600 40 L1180 160"/>
        <path d="M640 260 L1190 300"/>
        <path d="M700 0 L760 600"/>
        <path d="M980 0 L1040 470"/>
        <path d="M620 420 L1180 380"/>
        <path d="M860 80 L900 560"/>
        <path d="M1100 20 L1140 440"/>
      </g>
      <g stroke="#FFF4E0" stroke-opacity=".34" stroke-width="4">
        <path d="M560 120 C760 170 900 230 1200 220"/>
        <path d="M820 0 C800 200 840 380 800 600"/>
      </g>
    </g>

    <!-- Donor areas: approximate discs, never exact points -->
    <g fill="#3DD6C5">
      <circle cx="745" cy="150" r="34" fill-opacity=".18" stroke="#3DD6C5" stroke-width="2"/>
      <circle cx="745" cy="150" r="6"/>
      <circle cx="1080" cy="120" r="30" fill-opacity=".18" stroke="#3DD6C5" stroke-width="2"/>
      <circle cx="1080" cy="120" r="6"/>
      <circle cx="690" cy="360" r="28" fill-opacity=".18" stroke="#3DD6C5" stroke-width="2"/>
      <circle cx="690" cy="360" r="6"/>
      <circle cx="1120" cy="350" r="32" fill-opacity=".18" stroke="#3DD6C5" stroke-width="2"/>
      <circle cx="1120" cy="350" r="6"/>
    </g>

    <!-- Donor on the way: dashed route to the hospital -->
    <path d="M1000 210 C960 250 940 270 905 300" fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 12"/>
    <circle cx="1000" cy="210" r="18" fill="#FBBF24" stroke="#0E1513" stroke-width="4"/>
    <path d="M1000 199 l8 16 -8 -4 -8 4 z" fill="#2B1B00"/>

    <!-- Urgent request at the hospital: drop with a plus and a pulse ring -->
    <circle cx="890" cy="318" r="70" fill="none" stroke="#FF6B7D" stroke-opacity=".25" stroke-width="2"/>
    <circle cx="890" cy="318" r="50" fill="none" stroke="#FF6B7D" stroke-opacity=".55" stroke-width="2"/>
    <path d="M890 262 C890 262 858 298 858 318 a32 32 0 0 0 64 0 C922 298 890 262 890 262z" fill="#FF6B7D" stroke="#0E1513" stroke-width="4"/>
    <path d="M885 305h10v10h10v10h-10v10h-10v-10h-10v-10h10z" fill="#2A0509"/>

    <!-- Hospital marker -->
    <rect x="938" y="380" width="44" height="44" rx="11" fill="#F2ECE4"/>
    <path d="M955 390h10v12h12v10h-12v12h-10v-12h-12v-10h12z" fill="#0E1513"/>

    <!-- Fade the map under the text -->
    <rect width="760" height="600" fill="#0E1513" opacity=".55"/>
  </g>

  <!-- Text -->
  <g font-family="'Anek Bangla','Hind Siliguri','Noto Sans Bengali','Nirmala UI','Kohinoor Bangla','Bangla Sangam MN','Vrinda',sans-serif">
    <text x="72" y="118" font-size="18" font-weight="700" letter-spacing="2.4" fill="#FF6B7D" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">BLOOD DONOR APP · BANGLADESH</text>
    <text x="68" y="206" font-size="90" font-weight="700" fill="#F5EFEA">রক্তবন্ধু</text>
    <text x="72" y="334" font-size="44" font-weight="700" fill="#F5EFEA" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Roktobondhu</text>
    <text x="72" y="392" font-size="30" fill="#BDB0A8">রক্ত দিন, জীবন বাঁচান</text>
    <text x="72" y="436" font-size="24" fill="#BDB0A8" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Find blood donors near you on a live map.</text>
  </g>

  <!-- Legend chips: status is never colour alone -->
  <g font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600">
    <rect x="72" y="476" width="128" height="36" rx="18" fill="#FF6B7D"/>
    <text x="136" y="500" text-anchor="middle" fill="#2A0509">Urgent</text>
    <rect x="212" y="476" width="148" height="36" rx="18" fill="#3DD6C5"/>
    <text x="286" y="500" text-anchor="middle" fill="#04201C">Donors</text>
    <rect x="372" y="476" width="156" height="36" rx="18" fill="#FBBF24"/>
    <text x="450" y="500" text-anchor="middle" fill="#2B1B00">On the way</text>
  </g>

  <text x="1176" y="584" text-anchor="end" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" fill="#F2ECE4" fill-opacity=".55">Illustration · map data © OpenStreetMap contributors in the app</text>
</svg>
